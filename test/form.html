<!DOCTYPE html>
<html lang="en-GB">

<head>
    <title>Sassy test</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <link rel="stylesheet" href="../test/css/form.css" />
</head>

<body>

    <div class="wrap">

        <h1>Form Controls</h1>

        <form>

            <h2>Text inputs</h2>

            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" class="control" placeholder="Placeholder" aria-describedby="name-help" />
                <span id="name-help" class="help">Help text sits below the control.</span>
            </div>

            <div class="field">
                <label for="email">Email (required - type something invalid, then leave the field)</label>
                <input type="email" id="email" class="control" required />
            </div>

            <div class="field">
                <label for="small">Small</label>
                <input type="text" id="small" class="control-sm" placeholder="Small" />
            </div>

            <div class="field">
                <label for="large">Large</label>
                <input type="text" id="large" class="control-lg" placeholder="Large" />
            </div>

            <div class="field">
                <label for="readonly">Read only</label>
                <input type="text" id="readonly" class="control" value="Read only value" readonly />
            </div>

            <div class="field">
                <label for="disabled">Disabled</label>
                <input type="text" id="disabled" class="control" value="Disabled value" disabled />
            </div>

            <div class="field">
                <label for="plain">Plain text</label>
                <input type="text" id="plain" class="plaintext" value="email@example.com" readonly />
            </div>

            <div class="field">
                <label for="message">Textarea</label>
                <textarea id="message" class="control" rows="3"></textarea>
            </div>

            <h2>Selects</h2>

            <div class="field">
                <label for="select">Select</label>
                <select id="select" class="select">
                    <option>One</option>
                    <option>Two</option>
                    <option>Three</option>
                </select>
            </div>

            <div class="field">
                <label for="select-sm">Small</label>
                <select id="select-sm" class="select-sm">
                    <option>Small select</option>
                </select>
            </div>

            <div class="field">
                <label for="select-lg">Large</label>
                <select id="select-lg" class="select-lg">
                    <option>Large select</option>
                </select>
            </div>

            <div class="field">
                <label for="select-multiple">Multiple</label>
                <select id="select-multiple" class="select" multiple>
                    <option>One</option>
                    <option>Two</option>
                    <option>Three</option>
                </select>
            </div>

            <div class="field">
                <label for="select-disabled">Disabled</label>
                <select id="select-disabled" class="select" disabled>
                    <option>Disabled select</option>
                </select>
            </div>

            <h2>Checks and radios</h2>

            <div class="field">
                <div class="check">
                    <input type="checkbox" id="check-1" class="check-input" />
                    <label for="check-1" class="check-label">Default checkbox</label>
                </div>
                <div class="check">
                    <input type="checkbox" id="check-2" class="check-input" checked />
                    <label for="check-2" class="check-label">Checked checkbox</label>
                </div>
                <div class="check">
                    <input type="checkbox" id="check-3" class="check-input" />
                    <label for="check-3" class="check-label">Indeterminate checkbox (set by script)</label>
                </div>
                <div class="check">
                    <input type="checkbox" id="check-4" class="check-input" disabled />
                    <label for="check-4" class="check-label">Disabled checkbox</label>
                </div>
                <div class="check">
                    <input type="checkbox" id="check-5" class="check-input" aria-describedby="check-5-help" />
                    <label for="check-5" class="check-label">A checkbox with a much longer label that wraps onto a second line to show that the text stays aligned beside the box rather than flowing underneath it</label>
                    <span id="check-5-help" class="help">Help text lines up with the label.</span>
                </div>
            </div>

            <div class="field">
                <div class="check">
                    <input type="radio" name="radio" id="radio-1" class="check-input" />
                    <label for="radio-1" class="check-label">Default radio</label>
                </div>
                <div class="check">
                    <input type="radio" name="radio" id="radio-2" class="check-input" checked />
                    <label for="radio-2" class="check-label">Checked radio</label>
                </div>
                <div class="check">
                    <input type="radio" name="radio-disabled" id="radio-3" class="check-input" disabled />
                    <label for="radio-3" class="check-label">Disabled radio</label>
                </div>
            </div>

            <div class="field">
                <div class="check-inline">
                    <input type="checkbox" id="inline-1" class="check-input" />
                    <label for="inline-1" class="check-label">Inline one</label>
                </div>
                <div class="check-inline">
                    <input type="checkbox" id="inline-2" class="check-input" />
                    <label for="inline-2" class="check-label">Inline two</label>
                </div>
            </div>

            <h2>Switches</h2>

            <div class="field">
                <div class="check">
                    <input type="checkbox" role="switch" id="switch-1" class="switch" />
                    <label for="switch-1" class="check-label">Default switch</label>
                </div>
                <div class="check">
                    <input type="checkbox" role="switch" id="switch-2" class="switch" checked />
                    <label for="switch-2" class="check-label">Checked switch</label>
                </div>
                <div class="check">
                    <input type="checkbox" role="switch" id="switch-3" class="switch" disabled />
                    <label for="switch-3" class="check-label">Disabled switch</label>
                </div>
            </div>

            <h2>Validation</h2>

            <div class="field">
                <label for="native">Native - type fewer than 3 characters, then leave the field</label>
                <input type="text" id="native" class="control" minlength="3" required aria-describedby="native-feedback" />
                <span id="native-feedback" class="feedback-invalid">Please enter at least 3 characters.</span>
            </div>

            <div class="field">
                <label for="server-invalid">Server-side invalid (aria-invalid)</label>
                <input type="text" id="server-invalid" class="control" value="taken" aria-invalid="true" aria-describedby="server-invalid-feedback" />
                <span id="server-invalid-feedback" class="feedback-invalid">That username is already taken.</span>
            </div>

            <div class="field">
                <label for="placeholder-invalid">Invalid placeholder</label>
                <input type="text" id="placeholder-invalid" class="control invalid" value="Red border from the placeholder" />
            </div>

            <div class="field">
                <label for="valid">Valid placeholder</label>
                <input type="text" id="valid" class="control valid" value="Looks good" aria-describedby="valid-feedback" />
                <span id="valid-feedback" class="feedback-valid">Looks good!</span>
            </div>

            <div class="field">
                <label for="select-invalid">Select, invalid placeholder</label>
                <select id="select-invalid" class="select invalid">
                    <option>Choose...</option>
                </select>
            </div>

            <div class="field">
                <div class="check">
                    <input type="checkbox" id="terms" class="check-input" required aria-describedby="terms-feedback" />
                    <label for="terms" class="check-label">Agree to terms (required - tick then untick)</label>
                    <span id="terms-feedback" class="feedback-invalid">You must agree before submitting.</span>
                </div>
            </div>

        </form>

    </div>

    <script>document.getElementById("check-3").indeterminate = true;</script>

</body>

</html>
