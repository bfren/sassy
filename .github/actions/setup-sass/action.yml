name: Install Dart Sass
description: Installs a fixed Dart Sass version, so a new release cannot change the output or break a build. Bump it on purpose.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SASS_VERSION: 1.106.1
      run: |
        curl -fsSL "https://github.com/sass/dart-sass/releases/download/$SASS_VERSION/dart-sass-$SASS_VERSION-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
