name: Publish GitHub Pages

# Builds the samples site with tools/site.mjs and publishes it whenever a pull request is merged
# into main. A merge creates a push to main, so this deploys from main itself. Deploying from the
# pull request's merge ref is refused by the github-pages environment's branch rules.
# Requires Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Dart Sass
        uses: ./.github/actions/setup-sass

      - name: Build the site
        run: node tools/site.mjs build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        