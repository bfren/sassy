name: Publish GitHub Pages

# Publishes the samples folder as the site root whenever a pull request is merged into main.
# Requires Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dart Sass
        run: npm install --prefix "$RUNNER_TEMP/sass" sass@1.93.2

      - name: Compile sample stylesheets
        run: |
          "$RUNNER_TEMP/sass/node_modules/.bin/sass" --no-source-map --load-path=src samples/sass:samples/css

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: samples

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
