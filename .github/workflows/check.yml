name: Check

# Checks every pull request: Sassy compiles, the CSS shown in README.md and docs/*.md is what
# Sassy outputs, and every example on the samples site compiles and is used by its page.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Dart Sass
        run: |
          version=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/sass/dart-sass/releases/latest)
          version=${version##*/}
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/$version/dart-sass-$version-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Compile Sassy
        run: sass --no-source-map src/full.sass "$RUNNER_TEMP/full.css"

      - name: Check the docs
        run: node tools/site.mjs check

      - name: Build the site
        run: node tools/site.mjs build
      