name: Check

# Checks every pull request: Sassy compiles, the CSS shown in README.md and docs/*.md is what
# Sassy outputs, and every example on the samples site compiles and is used by its page.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Dart Sass
        uses: ./.github/actions/setup-sass

      - name: Rebuild dist and check it is committed
        run: |
          ./compile-full.sh
          git diff --exit-code dist docs || { echo "::error::dist/ or docs/*.svg is out of date - run ./compile-full.sh and commit the result"; exit 1; }

      - name: Test sassy.js
        run: |
          npm install --no-save jsdom@26.1.0
          node --test tools/sassy.test.mjs

      - name: Check the docs
        run: node tools/site.mjs check

      - name: Build the site
        run: node tools/site.mjs build
      